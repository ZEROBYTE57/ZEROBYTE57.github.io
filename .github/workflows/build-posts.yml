name: Build blog index

on:
  push:
    branches: ["**"]          # every branch (main, v1, ...), not tags
    paths:
      - "blog/posts/**.md"
      - "work/**.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_posts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898769+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/index.json blog/s sitemap.xml
          if [ -d v1/blog/s ]; then git add v1/blog/s; fi   # share pages of the classic design at /v1/
          git diff --staged --quiet || git commit -m "Rebuild blog index"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"   # the branch this run is on, so v1 never pulls in main
          git push
