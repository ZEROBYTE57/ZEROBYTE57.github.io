name: Build blog index

on:
  push:
    paths:
      - "blog/posts/**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_posts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898769+github-actions[bot]@users.noreply.github.com"
          git add blog/posts/index.json
          git diff --staged --quiet || git commit -m "Rebuild blog index"
          git pull --rebase --autostash origin main
          git push
