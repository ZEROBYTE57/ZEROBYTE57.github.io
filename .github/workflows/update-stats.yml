name: Update coding and gaming stats

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_stats.py
      - run: python scripts/fetch_gaming.py
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          TRN_API_KEY: ${{ secrets.TRN_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898769+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/gaming.json
          git diff --staged --quiet || git commit -m "Update coding stats"
          git pull --rebase --autostash origin main
          git push
